[workspace]
authors = ["Open Force Field Initiative <info@openforcefield.org>"]
channels = ["conda-forge"]
name = "openff-recharge-docs"
platforms = ["linux-64", "osx-arm64"]

[tasks]

[dependencies]
python = "3.12.*"
pip = "*"
click = "*"
tqdm = "*"
numpy = "*"
jinja2 = "*"
pydantic = "<2.0"
openff-utilities = ">=0.1.5"
openff-units = "*"
openff-toolkit-base = ">=0.10.2"
openff-nagl-models = "*"
sqlalchemy = "*"
sqlite = "*"
sphinx = ">=4.4,<5"
sphinx-notfound-page = "*"
sphinxcontrib-bibtex = "*"
sphinx-click = "*"
myst-parser = "*"
autodoc-pydantic = "*"

[feature.docs.pypi-dependencies]
openff-sphinx-theme = { git = "https://github.com/openforcefield/openff-sphinx-theme", rev = "main" }
openff-recharge = { path = ".", editable = true }

[environments]
docs = ["docs"]
