name: openff-recharge-docs
channels:
  - conda-forge
dependencies:
    # Base depends
  - python =3.12
  - pip

    ### Core dependencies.

  - click
  - tqdm
  - numpy
  - jinja2
  - pydantic
  - openff-utilities >=0.1.5
  - openff-units =0.4
  - openff-toolkit-base =0.19

    # ESP storage
  - sqlalchemy
  - sqlite

    ### Documentation dependencies

  - sphinx >=4.4,<5
  - sphinx-notfound-page
  - sphinxcontrib-bibtex
  - sphinx-click
  - myst-parser
  - autodoc-pydantic

  # Dependencies not available on Conda Forge
  - pip:
    # Documentation theme
    - git+https://github.com/openforcefield/openff-sphinx-theme.git@main
