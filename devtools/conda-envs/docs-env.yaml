name: openff-recharge-docs
channels:
  - conda-forge
dependencies:
    # Base depends
  - python =3.12
  - pip

    ### Core dependencies.

  - click
  - tqdm
  - numpy
  - jinja2
  # autodoc_pydantic conflicts with 2.11+
  - pydantic =2.10
  - openff-utilities >=0.1.5
  - openff-units >=0.3
  # try not to install AmberTools, but 0.19+ takes Pydantic 2.13+ implicitly via Interchange
  - openff-toolkit-base =0.18.1

    # ESP storage
  - sqlalchemy
  - sqlite

    ### Documentation dependencies

  - sphinx >=4.4,<5
  - sphinx-notfound-page
  - sphinxcontrib-bibtex
  - sphinx-click
  - myst-parser
  - autodoc-pydantic

  # Dependencies not available on Conda Forge
  - pip:
    # Documentation theme
    - git+https://github.com/openforcefield/openff-sphinx-theme.git@main
